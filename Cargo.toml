[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/bridged",
    "crates/bridge-client",
    "crates/bridge-cli",
    "crates/functional-tests",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
# The oldest toolchain the workspace is known to compile on.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
