[package]
name = "protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared contract between the daemon, the UDF thin client and the CLI"

[dependencies]
anyhow = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
sha2 = { version = "0.11.0", optional = true }
toml = { version = "1.1.4", optional = true }

[features]
default = []
# Model passports: only the daemon and the CLI need them; the UDF thin client
# links the bare wire protocol and stays small.
passport = ["dep:anyhow", "dep:serde", "dep:sha2", "dep:toml"]
