name: Release

# A tag is the trigger, and the tag has to agree with the workspace version:
# an image labelled 1.2.0 built from crates that call themselves 1.1.0 is the
# kind of thing nobody notices until an incident.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: version and ci checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To read the tagged commit's check runs.
      checks: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      image: ${{ steps.check.outputs.image }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${crate}"
            exit 1
          fi
          {
            echo "version=$tag"
            # GHCR rejects uppercase, which a fork's owner name may contain.
            echo "image=${GITHUB_REPOSITORY,,}"
            case "$tag" in
              *-*) echo "prerelease=true" ;;
              *)   echo "prerelease=false" ;;
            esac
          } >> "$GITHUB_OUTPUT"
      # A tag is a claim that CI proved this commit. Refuse to release one
      # whose `ci` check is missing or red — push, let CI finish green, then
      # tag (or re-run this workflow once it is).
      - name: the tagged commit must have passed ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A commit can carry several runs of the check (push and pull
          # request events); any successful one means CI proved these sources.
          conclusions=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}/check-runs?check_name=ci" \
              --jq '[.check_runs[] | select(.name == "ci") | .conclusion // "pending"] | unique | join(", ")')
          if ! echo "$conclusions" | tr ', ' '\n' | grep -qx success; then
            echo "::error::no successful 'ci' check on this commit (found: ${conclusions:-none})"
            exit 1
          fi

  build:
    name: ${{ matrix.arch }}
    needs: preflight
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: emulating a Rust and ONNX Runtime
          # build under QEMU costs more than it saves.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and proven before anything is published: the smoke test runs the
      # image for this architecture natively.
      - name: build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ch-model-bridge:${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: smoke test the image
        run: scripts/smoke-test.sh ch-model-bridge:${{ matrix.arch }}
      # SPDX inventory of the image that was just proven to serve, shipped as
      # a release asset so scanners see what an operator actually runs.
      - name: write the image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ch-model-bridge:${{ matrix.arch }}
          format: spdx-json
          output-file: sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: push the image by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.preflight.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Attestations are produced once, for the manifest list.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: record the digest
        run: |
          set -euo pipefail
          digest="${{ steps.push.outputs.digest }}"
          mkdir -p digests
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

      # Taken out of the image that was just smoke-tested, so the tarball holds
      # exactly the bytes the published image runs.
      - name: extract the binaries from the image
        run: |
          set -euo pipefail
          mkdir -p dist
          container=$(docker create ch-model-bridge:${{ matrix.arch }})
          for binary in bridged bridge-client model-bridge; do
            docker cp "$container:/usr/local/bin/$binary" "dist/$binary"
          done
          docker rm "$container" > /dev/null

      - name: package the tarballs
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          suffix="${version}-${{ matrix.arch }}-unknown-linux-gnu"

          binaries="ch-model-bridge-${suffix}"
          mkdir -p "package/$binaries"
          cp dist/bridged dist/bridge-client dist/model-bridge LICENSE README.md "package/$binaries/"
          chmod +x "package/$binaries"/bridge*  "package/$binaries/model-bridge"
          tar -czf "$binaries.tar.gz" -C package "$binaries"

          cp "sbom-${{ matrix.arch }}.spdx.json" "ch-model-bridge-${suffix}.spdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-${{ matrix.arch }}
          path: |
            ch-model-bridge-*.tar.gz
            ch-model-bridge-*.spdx.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish the multi-architecture image
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.prerelease == 'false' }}

      - name: join the per-architecture images into one tag
        id: manifest
        working-directory: digests
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE}"
          # shellcheck disable=SC2046  # the tag list is intentionally split
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          VERSION: ${{ needs.preflight.outputs.version }}

      # Signed provenance for the published index: `gh attestation verify`
      # then tells an operator that this image came from this repository.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: checksum the tarballs
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.spdx.json | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image }}
          VERSION: ${{ needs.preflight.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\` (linux/amd64, linux/arm64)."
            echo
            echo "Verify where it came from:"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "## Binaries"
            echo
            echo "\`ch-model-bridge-${VERSION}-<arch>-unknown-linux-gnu.tar.gz\` holds"
            echo "\`bridged\`, \`bridge-client\` and \`model-bridge\`, taken out of the"
            echo "image above. They are built against glibc 2.41 and need glibc 2.38 or"
            echo "newer; on older hosts use the container image."
            echo
            echo "\`ch-model-bridge-${VERSION}-<arch>-unknown-linux-gnu.spdx.json\` is the"
            echo "SPDX SBOM of the container image for that architecture."
            echo
            echo "Checksums are in \`SHA256SUMS\`."
          } > "$notes"

          flags=(--title "v${VERSION}" --notes-file "$notes" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # A re-run of this job must not trip over the release it already
            # made; replace the assets and leave the notes alone.
            gh release upload "${GITHUB_REF_NAME}" --clobber dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS
          fi
